name: Validate Registry

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/validate-registry.yml
      - registry/**
      - schemas/**
      - scripts/build-catalog.ps1
      - scripts/build-registry.ps1
      - scripts/validate-registry.ps1
      - scripts/registry-common.ps1
  push:
    branches:
      - main
    paths:
      - .github/workflows/validate-registry.yml
      - registry/**
      - schemas/**
      - scripts/build-catalog.ps1
      - scripts/build-registry.ps1
      - scripts/validate-registry.ps1
      - scripts/registry-common.ps1

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate registry entries, catalog, and detail consistency
        shell: pwsh
        run: ./scripts/validate-registry.ps1