name: Validate Registry

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/validate-registry.yml
      - registry/**
      - schemas/**
      - scripts/build-catalog.sh
      - scripts/build-registry.sh
      - scripts/validate-registry.sh
      - scripts/registry-common.sh
  push:
    branches:
      - main
    paths:
      - .github/workflows/validate-registry.yml
      - registry/**
      - schemas/**
      - scripts/build-catalog.sh
      - scripts/build-registry.sh
      - scripts/validate-registry.sh
      - scripts/registry-common.sh

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate registry entries, catalog, and detail consistency
        run: ./scripts/validate-registry.sh
