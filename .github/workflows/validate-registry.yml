name: Validate Registry

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/validate-registry.yml
      - registry/**
      - schemas/**
      - scripts/build-index.ps1
  push:
    branches:
      - main
    paths:
      - .github/workflows/validate-registry.yml
      - registry/**
      - schemas/**
      - scripts/build-index.ps1

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rebuild aggregate registry index
        shell: pwsh
        run: ./scripts/build-index.ps1

      - name: Verify generated files are committed
        shell: pwsh
        run: |
          $changes = git status --short --untracked-files=no
          if ($changes) {
            Write-Host $changes
            throw 'Generated files are out of date. Run ./scripts/build-index.ps1 and commit the updated output.'
          }